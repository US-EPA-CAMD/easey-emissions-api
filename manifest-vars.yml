#THIS FILE SHOULD CONTAIN DEV SETTINGS AND CI/CD WORKFLOW WILL CHANGE SETTINGS BASED ON ENV
disk: 1024
memory: 2048
instances: 1
name: emissions-api
host: api-easey-dev.app.cloud.gov
port: 8080
path: emissions-mgmt
title: Emissions Management
description: Emissions management API endpoints for apportioned emissions data (e.g. hourly, daily, monthly, annual, and ozone season)
